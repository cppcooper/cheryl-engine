# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/build-customization.html

version: 2

build:
  os: ubuntu-24.04
  apt_packages:
    - graphviz
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - python docs/site/generation/bootstrap.py exec --force-pinned -- python docs/site/generation/build.py --clean --output "$READTHEDOCS_OUTPUT"
