name: Build and test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-dependencies:
    name: windows-dependencies
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact: vcpkg-installed-Windows-X64-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependencies
        uses: ./.github/actions/prepare-dependencies
        with:
          profile: modules
          cache-job: windows-dependencies
          windows-vcpkg: build
      - name: Identify prepared Windows installation
        run: python .github/ci/dependencies.py windows-stamp --profile modules
      - name: Share prepared Windows installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-installed-Windows-X64-${{ github.run_id }}
          path: build/ci/vcpkg_installed/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  headless:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gcc-hwloc, os: ubuntu-24.04, cache_family: linux-gcc14, type: Release, hwloc: 'ON', cc: gcc-14, cxx: g++-14}
          - {name: linux-gcc-neutral, os: ubuntu-24.04, cache_family: linux-gcc14, type: Release, hwloc: 'OFF', cc: gcc-14, cxx: g++-14}
          - {name: linux-clang-debug, os: ubuntu-24.04, cache_family: linux-clang18, type: Debug, hwloc: 'ON', cc: clang-18, cxx: clang++-18}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependencies
        id: dependencies
        uses: ./.github/actions/prepare-dependencies
        with:
          profile: headless
          cache-job: ${{ matrix.name }}
      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/restore-compiler-cache
        with:
          prefix: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}
      - name: Reset compiler cache statistics
        id: ccache-ready
        run: ccache --zero-stats
      - name: Check CI tools
        shell: bash
        run: |
          python .github/ci/test_ci.py
          python .github/ci/test_cache_cleanup.py
          python .github/ci/test_compiler_cache.py
          python .github/ci/test_dependencies.py
          python .github/ci/test_components.py
          python .github/ci/test_native_notices.py
          python .github/ci/test_verify_sdk.py
          python .github/ci/test_vcpkg_cache.py
          python .github/ci/test_vcpkg_publication.py
          python .github/ci/test_github_api.py
          python .github/ci/test_versions.py
          python .github/ci/test_release.py
      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          BUILD_TYPE: ${{ matrix.type }}
          HWLOC: ${{ matrix.hwloc }}
          CHERYL_STB_ALLOCATION_CFF: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
        run: python .github/ci/run.py --phase build --build-dir build/ci --profile headless --build-type "$BUILD_TYPE" --hwloc "$HWLOC"
      - name: Test Linux
        if: runner.os == 'Linux'
        env:
          BUILD_TYPE: ${{ matrix.type }}
          HWLOC: ${{ matrix.hwloc }}
          CHERYL_STB_ALLOCATION_CFF: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
        run: python .github/ci/run.py --phase test --build-dir build/ci --profile headless --build-type "$BUILD_TYPE" --hwloc "$HWLOC"
      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        run: ccache --show-stats --verbose
      - name: Pack compiler cache additions
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        id: compiler-cache-state
        shell: bash
        env:
          CCACHE_DELTA_ARCHIVE: ${{ steps.ccache.outputs.delta-archive }}
        run: python .github/ci/compiler_cache.py pack --output "$CCACHE_DELTA_ARCHIVE"
      - name: Retain compiler cache additions
        if: ${{ !cancelled() && steps.compiler-cache-state.outputs.has-content == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}-${{ matrix.name }}
          path: ${{ steps.ccache.outputs.delta-archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: |
            build/ci/junit.xml
            build/ci/Testing/Temporary/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  modules:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-modules, os: ubuntu-24.04, cache_family: linux-gcc14, type: Release, linkage: static}
          - {name: linux-modules-shared, os: ubuntu-24.04, cache_family: linux-gcc14, type: Release, linkage: shared}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependencies
        id: dependencies
        uses: ./.github/actions/prepare-dependencies
        with:
          profile: modules
          cache-job: ${{ matrix.name }}
      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/restore-compiler-cache
        with:
          prefix: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}
      - name: Reset compiler cache statistics
        id: ccache-ready
        run: ccache --zero-stats
      - name: Build Linux modules and SDK consumers
        if: runner.os == 'Linux'
        env:
          CC: gcc-14
          CXX: g++-14
          BUILD_TYPE: ${{ matrix.type }}
          LINKAGE: ${{ matrix.linkage }}
          CHERYL_STB_ALLOCATION_CFF: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
        run: |
          python .github/ci/run.py --phase build --build-dir build/ci --profile modules --build-type "$BUILD_TYPE" --linkage "$LINKAGE" --hwloc ON --sdk
          python .github/ci/package.py --build-dir build/ci --output build/packages
          python .github/ci/verify_sdk.py --phase build --packages build/packages --build-dir build/sdk-consumer --producer-build build/ci
      - name: Test Linux modules and SDK consumers
        if: runner.os == 'Linux'
        env:
          BUILD_TYPE: ${{ matrix.type }}
          LINKAGE: ${{ matrix.linkage }}
          CHERYL_STB_ALLOCATION_CFF: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
        run: |
          python .github/ci/run.py --phase test --build-dir build/ci --profile modules --build-type "$BUILD_TYPE" --linkage "$LINKAGE" --hwloc ON --sdk
          python .github/ci/verify_sdk.py --phase test --packages build/packages --build-dir build/sdk-consumer --producer-build build/ci
      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        run: ccache --show-stats --verbose
      - name: Pack compiler cache additions
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        id: compiler-cache-state
        shell: bash
        env:
          CCACHE_DELTA_ARCHIVE: ${{ steps.ccache.outputs.delta-archive }}
        run: python .github/ci/compiler_cache.py pack --output "$CCACHE_DELTA_ARCHIVE"
      - name: Retain compiler cache additions
        if: ${{ !cancelled() && steps.compiler-cache-state.outputs.has-content == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}-${{ matrix.name }}
          path: ${{ steps.ccache.outputs.delta-archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1
      - name: Retain checked SDK candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-sdk-${{ matrix.name }}
          path: build/packages/
          if-no-files-found: error
          retention-days: 3
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: |
            build/ci/junit.xml
            build/ci/Testing/Temporary/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/sdk-consumer/junit.xml
            build/sdk-consumer/Testing/Temporary/
            build/sdk-consumer/CMakeFiles/CMakeConfigureLog.yaml
            build/sdk-consumer-hermetic/junit.xml
            build/ci/cheryl-dependency-ownership.json
            build/ci/link-maps/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: ${{ matrix.name }}
    needs: [windows-dependencies]
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-msvc-hwloc, profile: headless, cache_family: windows-msvc, type: RelWithDebInfo, hwloc: 'ON', linkage: static}
          - {name: windows-modules, profile: modules, cache_family: windows-msvc, type: RelWithDebInfo, hwloc: 'ON', linkage: static}
          - {name: windows-modules-shared, profile: modules, cache_family: windows-msvc, type: RelWithDebInfo, hwloc: 'ON', linkage: shared}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependencies
        id: dependencies
        uses: ./.github/actions/prepare-dependencies
        with:
          profile: ${{ matrix.profile }}
          windows-vcpkg: consume
          prepared-artifact: ${{ needs.windows-dependencies.outputs.artifact }}
      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/restore-compiler-cache
        with:
          prefix: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}
      - name: Reset compiler cache statistics
        id: ccache-ready
        run: ccache --zero-stats
      - name: Check CI tools
        if: matrix.profile == 'headless'
        shell: bash
        run: |
          python .github/ci/test_ci.py
          python .github/ci/test_cache_cleanup.py
          python .github/ci/test_compiler_cache.py
          python .github/ci/test_dependencies.py
          python .github/ci/test_components.py
          python .github/ci/test_native_notices.py
          python .github/ci/test_verify_sdk.py
          python .github/ci/test_vcpkg_cache.py
          python .github/ci/test_vcpkg_publication.py
          python .github/ci/test_github_api.py
          python .github/ci/test_versions.py
          python .github/ci/test_release.py
      - name: Build Windows
        if: matrix.profile == 'headless'
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.type }}
          HWLOC: ${{ matrix.hwloc }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools are unavailable' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python .github/ci/run.py --phase build --build-dir build/ci --profile headless --build-type $env:BUILD_TYPE --hwloc $env:HWLOC --vcpkg-root $env:CHERYL_CI_VCPKG_ROOT --vcpkg-installed-dir $env:CHERYL_CI_VCPKG_INSTALLED_DIR
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows modules and SDK consumers
        if: matrix.profile == 'modules'
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.type }}
          LINKAGE: ${{ matrix.linkage }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools are unavailable' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python .github/ci/run.py --phase build --build-dir build/ci --profile modules --build-type $env:BUILD_TYPE --linkage $env:LINKAGE --hwloc ON --sdk --vcpkg-root $env:CHERYL_CI_VCPKG_ROOT --vcpkg-installed-dir $env:CHERYL_CI_VCPKG_INSTALLED_DIR
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/ci/package.py --build-dir build/ci --output build/packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/ci/verify_sdk.py --phase build --packages build/packages --build-dir build/sdk-consumer --producer-build build/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test Windows
        if: matrix.profile == 'headless'
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.type }}
          HWLOC: ${{ matrix.hwloc }}
        run: |
          python .github/ci/run.py --phase test --build-dir build/ci --profile headless --build-type $env:BUILD_TYPE --hwloc $env:HWLOC
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test Windows modules and SDK consumers
        if: matrix.profile == 'modules'
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.type }}
          LINKAGE: ${{ matrix.linkage }}
        run: |
          python .github/ci/run.py --phase test --build-dir build/ci --profile modules --build-type $env:BUILD_TYPE --linkage $env:LINKAGE --hwloc ON --sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/ci/verify_sdk.py --phase test --packages build/packages --build-dir build/sdk-consumer --producer-build build/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        run: ccache --show-stats --verbose
      - name: Pack compiler cache additions
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        id: compiler-cache-state
        shell: bash
        env:
          CCACHE_DELTA_ARCHIVE: ${{ steps.ccache.outputs.delta-archive }}
        run: python .github/ci/compiler_cache.py pack --output "$CCACHE_DELTA_ARCHIVE"
      - name: Retain compiler cache additions
        if: ${{ !cancelled() && steps.compiler-cache-state.outputs.has-content == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}-${{ matrix.name }}
          path: ${{ steps.ccache.outputs.delta-archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1
      - name: Retain checked SDK candidate
        if: matrix.profile == 'modules' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-sdk-${{ matrix.name }}
          path: build/packages/
          if-no-files-found: error
          retention-days: 3
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: |
            build/ci/junit.xml
            build/ci/Testing/Temporary/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/sdk-consumer/junit.xml
            build/sdk-consumer/Testing/Temporary/
            build/sdk-consumer/CMakeFiles/CMakeConfigureLog.yaml
            build/sdk-consumer-hermetic/junit.xml
            build/ci/cheryl-dependency-ownership.json
            build/ci/link-maps/
          if-no-files-found: warn
          retention-days: 14

  compiler-cache:
    name: Publish compiler cache (${{ matrix.cache_family }})
    if: ${{ !cancelled() }}
    needs: [headless, modules, windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cache_family: linux-gcc14
            legacy_1: linux-gcc-hwloc-Release
            legacy_2: linux-gcc-neutral-Release
            legacy_3: linux-modules-Release
            legacy_4: linux-modules-shared-Release
          - os: ubuntu-24.04
            cache_family: linux-clang18
            legacy_1: linux-clang-debug-Debug
            legacy_2: ''
            legacy_3: ''
            legacy_4: ''
          - os: windows-2025
            cache_family: windows-msvc
            legacy_1: windows-msvc-hwloc-RelWithDebInfo
            legacy_2: windows-modules-RelWithDebInfo
            legacy_3: windows-modules-shared-RelWithDebInfo
            legacy_4: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore compiler cache layers
        id: ccache
        uses: ./.github/actions/restore-compiler-cache
        with:
          prefix: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}
          attach: 'false'
      - name: Import previous compiler cache (1)
        if: steps.ccache.outputs.current-hit != 'true' && matrix.legacy_1 != ''
        uses: ./.github/actions/migrate-compiler-cache
        with:
          legacy-prefix: ccache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.legacy_1 }}
      - name: Import previous compiler cache (2)
        if: steps.ccache.outputs.current-hit != 'true' && matrix.legacy_2 != ''
        uses: ./.github/actions/migrate-compiler-cache
        with:
          legacy-prefix: ccache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.legacy_2 }}
      - name: Import previous compiler cache (3)
        if: steps.ccache.outputs.current-hit != 'true' && matrix.legacy_3 != ''
        uses: ./.github/actions/migrate-compiler-cache
        with:
          legacy-prefix: ccache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.legacy_3 }}
      - name: Import previous compiler cache (4)
        if: steps.ccache.outputs.current-hit != 'true' && matrix.legacy_4 != ''
        uses: ./.github/actions/migrate-compiler-cache
        with:
          legacy-prefix: ccache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.legacy_4 }}
      - name: Collect compiler cache additions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compiler-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_family }}-*
          path: build/cache/compiler-deltas
      - name: Merge compiler cache additions
        id: compiler-cache-state
        shell: bash
        run: python .github/ci/compiler_cache.py publish --deltas build/cache/compiler-deltas
      - name: Save compiler cache family
        if: steps.compiler-cache-state.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ccache.outputs.current-path }}
          key: ${{ steps.ccache.outputs.current-key }}

  sdk:
    name: Assemble accepted SDK and source packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [headless, modules, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-sdk-*
          path: packages
      - name: Assemble the four checked packages
        run: python .github/ci/release.py --assemble-only --packages packages --source . --output build/release-packages --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheryl-development-sdks-${{ github.sha }}
          path: |
            build/release-packages/*.tar.gz
            build/release-packages/*.zip
            build/release-packages/SHA256SUMS
            build/release-packages/SDK-MANIFESTS.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish accepted release
    if: github.event_name == 'push' && github.repository == 'cppcooper/cheryl-engine' && github.ref == 'refs/heads/main'
    needs: [sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download accepted SDK packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cheryl-development-sdks-${{ github.sha }}
          path: build/release-packages
      - name: Tag and publish the checked release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/ci/release.py --packages build/release-packages --revision "$GITHUB_SHA"
