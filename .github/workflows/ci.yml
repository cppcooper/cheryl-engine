name: Build and test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  headless:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gcc-hwloc, os: ubuntu-24.04, type: Release, hwloc: 'ON', cc: gcc-14, cxx: g++-14}
          - {name: linux-gcc-neutral, os: ubuntu-24.04, type: Release, hwloc: 'OFF', cc: gcc-14, cxx: g++-14}
          - {name: linux-clang-debug, os: ubuntu-24.04, type: Debug, hwloc: 'ON', cc: clang-18, cxx: clang++-18}
          - {name: windows-msvc-hwloc, os: windows-2025, type: RelWithDebInfo, hwloc: 'ON', cc: cl, cxx: cl}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependencies
        id: dependencies
        uses: ./.github/actions/prepare-dependencies
        with:
          profile: headless
      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/restore-compiler-cache
        with:
          prefix: ccache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.type }}
      - name: Reset compiler cache statistics
        id: ccache-ready
        run: ccache --zero-stats
      - name: Check CI tools
        shell: bash
        run: |
          python .github/ci/test_ci.py
          python .github/ci/test_cache_cleanup.py
          python .github/ci/test_compiler_cache.py
          python .github/ci/test_dependencies.py
      - name: Build and test Linux
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          BUILD_TYPE: ${{ matrix.type }}
          HWLOC: ${{ matrix.hwloc }}
          CHERYL_STB_ALLOCATION_CFF: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
        run: python .github/ci/run.py --build-dir build/ci --profile headless --build-type "$BUILD_TYPE" --hwloc "$HWLOC"
      - name: Build and test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.type }}
          HWLOC: ${{ matrix.hwloc }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools are unavailable' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python .github/ci/run.py --build-dir build/ci --profile headless --build-type $env:BUILD_TYPE --hwloc $env:HWLOC --vcpkg-root $env:CHERYL_CI_VCPKG_ROOT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check dependency cache updates
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.dependency-cache-writer == 'true' }}
        id: dependency-cache-state
        run: python .github/ci/dependencies.py cache-state
      - name: Save dependency packages and downloads
        if: ${{ !cancelled() && steps.dependencies.outputs.dependency-cache-writer == 'true' && steps.dependency-cache-state.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CHERYL_CI_DEPENDENCY_CACHE_DIR }}
          key: ${{ env.CHERYL_CI_DEPENDENCY_CACHE_KEY }}
      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        run: ccache --show-stats --verbose
      - name: Prepare compiler cache additions
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        id: compiler-cache-state
        shell: bash
        run: python .github/ci/compiler_cache.py prepare-save
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache-state.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ccache.outputs.current-path }}
          key: ${{ steps.ccache.outputs.current-key }}
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: |
            build/ci/junit.xml
            build/ci/Testing/Temporary/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  modules:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-modules, os: ubuntu-24.04, type: Release}
          - {name: windows-modules, os: windows-2025, type: RelWithDebInfo}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependencies
        id: dependencies
        uses: ./.github/actions/prepare-dependencies
        with:
          profile: modules
      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/restore-compiler-cache
        with:
          prefix: ccache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.type }}
      - name: Reset compiler cache statistics
        id: ccache-ready
        run: ccache --zero-stats
      - name: Build and test Linux modules
        if: runner.os == 'Linux'
        env:
          CC: gcc-14
          CXX: g++-14
          CHERYL_STB_ALLOCATION_CFF: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
        run: |
          python .github/ci/run.py --build-dir build/ci --profile modules --hwloc ON --sdk
          python .github/ci/package.py --build-dir build/ci --output build/packages
          python .github/ci/verify_sdk.py --packages build/packages --build-dir build/sdk-consumer --producer-build build/ci
      - name: Build and test Windows modules
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools are unavailable' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python .github/ci/run.py --build-dir build/ci --profile modules --build-type RelWithDebInfo --hwloc ON --sdk --vcpkg-root $env:CHERYL_CI_VCPKG_ROOT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/ci/package.py --build-dir build/ci --output build/packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/ci/verify_sdk.py --packages build/packages --build-dir build/sdk-consumer --producer-build build/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check dependency cache updates
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.dependency-cache-writer == 'true' }}
        id: dependency-cache-state
        run: python .github/ci/dependencies.py cache-state
      - name: Save dependency packages and downloads
        if: ${{ !cancelled() && steps.dependencies.outputs.dependency-cache-writer == 'true' && steps.dependency-cache-state.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CHERYL_CI_DEPENDENCY_CACHE_DIR }}
          key: ${{ env.CHERYL_CI_DEPENDENCY_CACHE_KEY }}
      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        run: ccache --show-stats --verbose
      - name: Prepare compiler cache additions
        if: ${{ !cancelled() && steps.ccache-ready.outcome == 'success' }}
        id: compiler-cache-state
        shell: bash
        run: python .github/ci/compiler_cache.py prepare-save
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache-state.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ccache.outputs.current-path }}
          key: ${{ steps.ccache.outputs.current-key }}
      - name: Retain checked SDK candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-sdk-${{ matrix.name }}
          path: build/packages/
          if-no-files-found: error
          retention-days: 3
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: |
            build/ci/junit.xml
            build/ci/Testing/Temporary/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/sdk-consumer/junit.xml
            build/sdk-consumer/Testing/Temporary/
            build/sdk-consumer/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  sdk:
    name: Collect accepted development SDKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [headless, modules]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-sdk-*
          path: packages
      - name: Check collected SDK checksums
        run: |
          for bundle in packages/candidate-sdk-*; do
            (cd "$bundle" && sha256sum --check SHA256SUMS)
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheryl-development-sdks-${{ github.sha }}
          path: |
            packages/**/*.tar.gz
            packages/**/*.zip
            packages/**/SHA256SUMS
            packages/**/SDK-MANIFEST.json
          if-no-files-found: error
          retention-days: 90
