name: Maintain Actions caches

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_run:
    workflows: ['Build and test', 'Documentation']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without changing caches'
        type: boolean
        default: true
      closed_pr:
        description: 'Optional closed PR number; leave empty for repository cleanup'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: actions-cache-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'cppcooper/cheryl-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Elevated events use trusted code, never the triggering PR or workflow's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Maintain cache budget
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLY_CLEANUP: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          CLOSED_PR: ${{ inputs.closed_pr || '' }}
        run: |
          args=(--budget-gib 8)
          if [[ "$APPLY_CLEANUP" == 'true' ]]; then
            args+=(--apply)
          fi
          if [[ -n "$CLOSED_PR" ]]; then
            args+=(--closed-pr "$CLOSED_PR")
          fi
          python3 .github/ci/cache_cleanup.py "${args[@]}"
